<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أنت مين من شخصيات TVD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Almarai:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column like a page from a morning journal; blush paper, burgundy ink, thin drips from the top edge. The single bold moment is the framed oval portrait on the result. */
:root{
  --paper:#f8eeeb;
  --card:#fffaf8;
  --ink:#2b1318;
  --mist:#6d595c;
  --line:#e4cfcb;
  --gold:#8c6526;
  --gold-line:#c29a55;
  --blood:#8b1a2b;
  --blood-hi:#a32236;
  --font-display:'Aref Ruqaa','Amiri',serif;
  --font-body:'Almarai','Tajawal',system-ui,sans-serif;
  --font-latin:'Cormorant Garamond',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 92% -10%, #f6d8d4 0, transparent 62%),
    radial-gradient(820px 520px at -10% 106%, #f0d2d0 0, transparent 62%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{text-wrap:balance}

/* subtle drips from the top edge */
.drips{position:absolute;top:0;left:0;right:0;height:0;z-index:2;pointer-events:none;opacity:.75}
.drips::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(139,26,43,.5),transparent)}
.drips i{
  position:absolute;top:0;inset-inline-start:var(--x);
  width:2px;height:var(--h);
  background:linear-gradient(to bottom,rgba(139,26,43,.2),rgba(139,26,43,.75));
  border-radius:0 0 2px 2px;
  animation:drip 7s cubic-bezier(.2,.7,.2,1) var(--d) both;
}
.drips i::after{
  content:"";position:absolute;bottom:-7px;left:50%;width:7px;height:9px;margin-left:-3.5px;
  background:rgba(139,26,43,.85);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
}
@keyframes drip{from{height:4px}}

.app{max-width:560px;margin:0 auto;padding:68px 18px 64px;outline:none}
.app.enter{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* intro */
.intro{text-align:center}
.logo{width:88px;height:88px;display:block;margin:0 auto 12px}
.brand{margin:0;font-weight:700;line-height:1.25}
.brand .b1{display:block;font-family:var(--font-display);font-size:clamp(30px,9vw,40px);color:var(--ink)}
.brand .b2{display:block;direction:ltr;font-family:var(--font-latin);font-weight:600;font-size:clamp(72px,24vw,104px);letter-spacing:.12em;line-height:1;color:var(--blood)}
.lede{font-family:var(--font-display);color:var(--gold);font-size:24px;line-height:1.6;margin:10px 0 16px}
.cast{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;margin:0 0 26px;padding:0;list-style:none}
.cast li{width:78px;font-size:13px;line-height:1.4;color:var(--ink)}
.cast li.plain{width:auto;padding:3px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
.cast .dot{--c:#000;--rgb:0,0,0;width:54px;height:54px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:var(--c);background:rgba(var(--rgb),.09);border:1px solid rgba(var(--rgb),.5)}
.cast .dot img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.meta{color:var(--mist);font-size:14px;margin:14px 0 0}

.btn{
  display:block;width:100%;max-width:320px;margin:0 auto;padding:14px 22px;
  border-radius:999px;border:1px solid var(--blood);background:var(--blood);color:#fff7f4;
  font:700 17px/1.4 var(--font-body);cursor:pointer;transition:background .2s,transform .2s;
}
.btn:hover{background:var(--blood-hi)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--blood);border-color:rgba(139,26,43,.45)}
.btn.ghost:hover{background:rgba(139,26,43,.06)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:2px solid var(--blood);outline-offset:3px}

/* question */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.eyebrow{color:var(--mist);font-size:14px}
.drops{display:flex;gap:7px}
.drops svg{width:12px;height:16px;overflow:visible}
.drops .done path{fill:var(--blood);stroke:var(--blood)}
.drops .now path{fill:none;stroke:var(--blood)}
.drops .todo path{fill:none;stroke:#d6bcb8}
.qtext{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.65;margin:0 0 24px;color:var(--ink)}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;
  padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:400 16px/1.7 var(--font-body);cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;
  box-shadow:0 6px 18px -14px rgba(139,26,43,.35);
}
.opt .mk{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mist);transition:all .2s}
.opt:hover{border-color:rgba(139,26,43,.55);background:#fff4f1}
.opt.prev{border-color:var(--gold-line)}
.opt.picked{border-color:var(--blood);background:rgba(139,26,43,.08)}
.opt.picked .mk{border-color:var(--blood);background:var(--blood);color:#fff7f4}
.nav{margin-top:20px;min-height:36px}
.link{background:none;border:0;padding:6px 0;color:var(--mist);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* result */
.res-head{text-align:center}
.small{font-size:14px;color:var(--mist);margin:0 0 18px}
.cameo{
  --c:#000;--rgb:0,0,0;
  width:170px;height:212px;margin:0 auto 20px;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;color:var(--c);
  background:radial-gradient(closest-side,rgba(var(--rgb),.14),rgba(var(--rgb),0) 92%),var(--card);
  border:1px solid rgba(var(--rgb),.6);
  box-shadow:0 0 0 6px var(--paper),0 0 0 7px rgba(var(--rgb),.35),0 26px 50px -28px rgba(var(--rgb),.7);
}
.cameo img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cameo.sm{width:92px;height:116px;margin:0;box-shadow:0 0 0 4px var(--card),0 0 0 5px rgba(var(--rgb),.35)}
.name{font-family:var(--font-display);font-weight:700;font-size:clamp(44px,13vw,62px);line-height:1.25;margin:0;color:var(--ink)}
.latin{display:block;direction:ltr;font-family:var(--font-latin);font-style:italic;font-size:25px;letter-spacing:.05em;color:var(--mist);line-height:1.3}
.pct{display:inline-block;margin-top:14px;padding:5px 18px;border-radius:999px;border:1px solid rgba(var(--rgb),.6);background:rgba(var(--rgb),.07);color:var(--c);font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-family:var(--font-display);color:var(--gold);font-size:23px;line-height:1.6;margin:14px 0 0}

.card{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,250,248,.88);box-shadow:0 16px 36px -28px rgba(139,26,43,.45)}
.card h3{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.5;color:var(--blood);margin:0 0 6px}
.card p{margin:0}
.card h3:not(:first-child){margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;color:var(--ink)}
.chip .ic{--c:#000;--rgb:0,0,0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:var(--c);background:rgba(var(--rgb),.1);border:1px solid rgba(var(--rgb),.5)}
.chip .ic img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cites{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.cites li{padding-inline-start:14px;border-inline-start:2px solid var(--blood);color:var(--mist)}
.cites b{font-weight:700;color:var(--ink)}
.second{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:16px}
.second.np{grid-template-columns:1fr}
.second .name{font-size:38px}
.second .latin{font-size:19px;text-align:right}
.second .pct{margin-top:6px;font-size:14px}

.bars{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.bar-row{--c:#000;--rgb:0,0,0;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}
.bar-row.np{grid-template-columns:1fr auto}
.bar-row .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:var(--c);background:rgba(var(--rgb),.1);border:1px solid rgba(var(--rgb),.5)}
.bar-row .ic img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.bar-name{font-size:15px;line-height:1.4}
.bar-name em{font-family:var(--font-latin);font-size:16px;color:var(--mist);margin-inline-start:10px;direction:ltr;display:inline-block}
.bar-pct{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:end;color:var(--ink)}
.track{height:6px;margin-top:7px;border-radius:99px;background:rgba(43,19,24,.09);overflow:hidden}
.fill{height:100%;width:var(--w);background:var(--c);border-radius:inherit;transform-origin:right center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}

.actions{display:grid;gap:10px;margin-top:26px}
.fallback{width:100%;margin-top:10px;min-height:150px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px}
.foot{margin-top:34px;text-align:center;color:var(--mist);font-size:13px;line-height:1.9}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
/*ENGINE_START*/

const CHARS = {
  damon:{ ar:'دايمن سالفاتور', en:'Damon', color:'#35618f', rgb:'53,97,143',
    tag:'قلب موجوع خلف قناع السخرية',

  stefan:{ ar:'ستيفان سالفاتور', en:'Stefan', color:'#4a7a3e', rgb:'74,122,62',

const QUESTIONS = [
  { topic:'القناع', q:'وراء أقوى ابتسامة لك، ما الذي لا يعرفه عنك أحد؟', opts:[

/* ans[qi] = index of the chosen option inside QUESTIONS[qi].opts */
function computeResult(ans){
  const s = {};
  ORDER.forEach(k => s[k] = 0);
  QUESTIONS.forEach((q, qi) => {
    const o = q.opts[ans[qi]];
    if(!o) return;
    const bump = 1 + qi * 0.01;               // later answers break ties
    for(const k in o.w) s[k] += o.w[k] * bump;
  });
  const ranked = ORDER.slice().sort((a, b) => (s[b] - s[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b)));
  const total = ORDER.reduce((t, k) => t + s[k], 0) || 1;
  const top = s[ranked[0]] || 1;
  const shareTop = top / total;
  const topPct = Math.max(72, Math.min(97, Math.round(62 + 140 * (shareTop - 0.2))));
  const pct = {};
  ORDER.forEach(k => { pct[k] = Math.max(6, Math.round(topPct * Math.pow(s[k] / top, 1.25))); });
  pct[ranked[0]] = topPct;
  pct[ranked[1]] = Math.min(pct[ranked[1]], topPct - 1);
  for(let i = 2; i < ranked.length; i++){
    pct[ranked[i]] = Math.min(pct[ranked[i]], pct[ranked[i - 1]]);
  }
  return { scores:s, ranked, pct };
}

/* the answers that pushed the result toward character k */
function citedFor(k, ans, n){
  const items = [];
  QUESTIONS.forEach((q, qi) => {
    const o = q.opts[ans[qi]];
    if(o && o.w[k]) items.push({ qi, w:o.w[k], topic:q.topic, text:o.t });
  });
  items.sort((a, b) => (b.w - a.w) || (a.qi - b.qi));
  const strong = items.filter(x => x.w >= 2);
  return (strong.length ? strong : items).slice(0, n);
}

/* ---------- UI ---------- */
const TITLE = 'أنت مين من شخصيات TVD';
const $app = document.getElementById('app');
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const MK = ['أ','ب','ج','د','هـ','و'];
const state = { qi:0, ans:[], order:[], lock:false, text:'' };

function shuffle(a){
  const r = a.slice();
  for(let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function paint(html){
  $app.innerHTML = html;
  $app.classList.remove('enter');
  void $app.offsetWidth;
  $app.classList.add('enter');
  window.scrollTo(0, 0);
  try{ $app.focus({ preventScroll:true }); }catch(_){}
}

/* a character's name, with its portrait beside it once one is supplied */
function chip(k){
  return '<span class="chip">' +
    (PHOTOS[k] ? '<span class="ic" ' + swatch(k) + '>' + face(k) + '</span>' : '') +
    '<span>' + CHARS[k].ar + '</span></span>';
}
function cameo(k, cls){
  return PHOTOS[k] ? '<div class="cameo ' + (cls || '') + '" ' + swatch(k) + '>' + face(k) + '</div>' : '';
}

function renderIntro(){
  const cast = ORDER.map(k => PHOTOS[k]
    ? '<li><div class="dot" ' + swatch(k) + '>' + face(k) + '</div>' + CHARS[k].ar + '</li>'
    : '<li class="plain">' + CHARS[k].ar + '</li>'
  ).join('');
  paint(
    '<section class="intro">' + LOGO +
    '<h1 class="brand" aria-label="' + TITLE + '"><span class="b1">أنت مين من شخصيات</span><span class="b2">TVD</span></h1>' +
    '<p class="lede">٧ أسئلة تكشف اللي مستخبي جواك</p>' +
    '<ul class="cast" aria-label="الشخصيات">' + cast + '</ul>' +
    '<button class="btn" data-act="start">هيا نبدأ</button>' +
    '<p class="meta">سبعة أسئلة · نحو دقيقتين</p>' +
    '<p class="foot">اختبار ترفيهي للمعجبين، مستوحى من مسلسل The Vampire Diaries وغير تابع له.</p>' +
    '</section>'
  );
}

  const prev = state.ans[state.qi];
  const drops = QUESTIONS.map((_, i) =>
    '<svg class="' + (i < state.qi ? 'done' : i === state.qi ? 'now' : 'todo') + '" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 1C6 1 1 7.5 1 10.5a5 5 0 0 0 10 0C11 7.5 6 1 6 1z" stroke-width="1.2"/></svg>'
  ).join('');
  const opts = ord.map((oi, pos) =>
    '<li><button class="opt' + (prev === oi ? ' prev' : '') + '" data-oi="' + oi + '"><span class="mk">' + MK[pos] + '</span><span>' + q.opts[oi].t + '</span></button></li>'
  ).join('');
  paint(
    '<section>' +
    '<div class="qhead"><span class="eyebrow">' + AR(state.qi + 1) + ' من ' + AR(QUESTIONS.length) + ' · ' + q.topic + '</span>' +
    '<div class="drops" role="img" aria-label="السؤال ' + AR(state.qi + 1) + ' من ' + AR(QUESTIONS.length) + '">' + drops + '</div></div>' +
    '<h2 class="qtext">' + q.q + '</h2>' +
    '<ul class="opts">' + opts + '</ul>' +
    '<div class="nav">' + (state.qi > 0 ? '<button class="link" data-act="back">السؤال السابق</button>' : '') + '</div>' +
    '</section>'
  );
}

function citesHtml(k, n){
  return citedFor(k, state.ans, n).map(x =>
    '<li><b>في «' + x.topic + '»</b> وقع اختيارك على: «' + x.text + '»</li>'
  ).join('');
}

function renderResult(){
  const R = computeResult(state.ans);
  const a = R.ranked[0], b = R.ranked[1];
  const A = CHARS[a], B = CHARS[b];

  const bars = R.ranked.map(k => {
    const c = CHARS[k];
    return '<li class="bar-row' + (PHOTOS[k] ? '' : ' np') + '" style="--c:' + c.color + ';--rgb:' + c.rgb + ';--w:' + R.pct[k] + '%">' +
      (PHOTOS[k] ? '<div class="ic">' + face(k) + '</div>' : '') +
      '<div><div class="bar-name">' + c.ar + '<em>' + c.en + '</em></div><div class="track"><div class="fill"></div></div></div>' +
      '<div class="bar-pct">' + AR(R.pct[k]) + '٪</div></li>';
  }).join('');

  state.text =
    'نتيجتي في اختبار «' + TITLE + '»\n' +
    'أقرب شخصية: ' + A.ar + ' (' + AR(R.pct[a]) + '٪)\n' +
    'الشخصية الثانية: ' + B.ar + ' (' + AR(R.pct[b]) + '٪)\n\n' +
    R.ranked.map(k => CHARS[k].ar + ': ' + AR(R.pct[k]) + '٪').join('\n');

  paint(
    '<section>' +
    '<div class="res-head">' +
    '<p class="small">أقرب شخصية إليك</p>' +
    cameo(a) +
    '<h2 class="name">' + A.ar + '</h2><span class="latin">' + A.en + '</span>' +
    '<span class="pct" ' + swatch(a) + '>تطابق ' + AR(R.pct[a]) + '٪</span>' +
    '<p class="tag">' + A.tag + '</p>' +
    '</div>' +

    '<div class="card">' +
    '<h3>لماذا ' + chip(a) + '؟</h3><p>' + A.why + '</p>' +
    '<h3>إجاباتك التي دلّت على ذلك</h3><ul class="cites">' + citesHtml(a, 3) + '</ul>' +
    '<h3>ما يختبئ تحت السطح</h3><p>' + A.hidden + '</p>' +
    '<h3>ما يحتاجه قلبك</h3><p>' + A.needs + '</p>' +
    '</div>' +

    '<div class="card">' +
    '<h3>الشخصية الثانية الأقرب إليك</h3>' +
    '<div class="second' + (PHOTOS[b] ? '' : ' np') + '">' + cameo(b, 'sm') +
    '<div><h2 class="name">' + B.ar + '</h2><span class="latin">' + B.en + '</span>' +
    '<span class="pct" ' + swatch(b) + '>تطابق ' + AR(R.pct[b]) + '٪</span></div></div>' +
    '<h3>ما يجمعك مع ' + chip(b) + '</h3><p>' + B.shared + '</p>' +
    '<h3>ما دلّ على ذلك</h3><ul class="cites">' + citesHtml(b, 2) + '</ul>' +
    '</div>' +

    '<div class="card">' +
    '<h3>نسبة قربك من كل الشخصيات</h3>' +
    '<ul class="bars">' + bars + '</ul>' +
    '</div>' +

    '<div class="actions">' +
    '<button class="btn" data-act="copy">نسخ النتيجة</button>' +
    '<button class="btn ghost" data-act="retake">إعادة الاختبار</button>' +
    '</div>' +
    '<textarea id="fb" class="fallback" readonly hidden aria-label="نص النتيجة"></textarea>' +
    '</section>'
  );
}

function startQuiz(){
  state.ans = [];
  state.qi = 0;
  state.lock = false;
  state.order = QUESTIONS.map(q => shuffle(q.opts.map((_, i) => i)));
  renderQ();
}

async function copyResult(btn){
  try{
    await navigator.clipboard.writeText(state.text);
    btn.textContent = 'تم النسخ';
    setTimeout(() => { btn.textContent = 'نسخ النتيجة'; }, 1800);
  }catch(_){
    const ta = document.getElementById('fb');
    if(ta){
      ta.hidden = false;
      ta.value = state.text;
      ta.focus();
      ta.select();
    }
  }
}

$app.addEventListener('click', e => {
  const opt = e.target.closest('[data-oi]');
  if(opt){
    if(state.lock) return;
    state.lock = true;
    state.ans[state.qi] = +opt.dataset.oi;
    opt.classList.add('picked');
    setTimeout(() => {
      state.lock = false;
      if(state.qi < QUESTIONS.length - 1){ state.qi++; renderQ(); }
      else renderResult();
    }, 380);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act === 'start' || act === 'retake') startQuiz();
  else if(act === 'back' && state.qi > 0){ state.qi--; renderQ(); }
  else if(act === 'copy') copyResult(btn);
});

renderIntro();
</script>
</body>
</html>
